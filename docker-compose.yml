version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server 
      --requirepass "epiproxy_secret" 
      --appendonly yes 
      --maxmemory 2gb 
      --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 3G

volumes:
  redis_data:

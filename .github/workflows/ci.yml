name: EpiProxy CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # We need a Redis service for integration tests to pass
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Tests
      env:
        # Override the redis URL to point to the service we started in the workflow
        # Without requirepass since the test redis service above doesn't have one
        EPIPROXY_REDIS_URL: redis://localhost:6379
        EPIPROXY_LOG_LEVEL: DEBUG
      run: |
        mvn -B test

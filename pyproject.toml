[project]
name = "epiproxy"
version = "0.1.0"
description = "Agentic proxy with epidemiological propagation control"
authors = [
    {name = "Yugendhar S"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "networkx>=3.3",
    "redis>=5.0.7",
    "sentence-transformers>=3.0.1",
    "pydantic>=2.7.4",
    "pydantic-settings",
    "async-lru"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-asyncio>=0.23.7",
    "langchain-core>=0.2.0",
    "langgraph>=0.1.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
